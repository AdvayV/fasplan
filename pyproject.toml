[project]
name = "fasplan"
version = "0.1.0"
description = "Failure-aware subnet design and route summarization planner for resilient campus networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "jinja2>=3"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
analysis = ["matplotlib>=3.8"]
lab = ["netmiko>=4"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
fasplan = "fasplan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fasplan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
